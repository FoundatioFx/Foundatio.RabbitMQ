# RabbitMQ configuration for chaos testing node 1 (cluster seed node)
# Most constrained: 300MB memory watermark

vm_memory_high_watermark.absolute = 300MB
disk_free_limit.absolute = 10MB

# Aspire starts the other nodes only after this seed becomes healthy. Discover
# only the seed during its first boot; the other nodes discover and join it.
# Listing not-yet-started peers here creates a circular startup dependency.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@chaos1
